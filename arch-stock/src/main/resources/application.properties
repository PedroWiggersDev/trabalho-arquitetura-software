quarkus.http.port=8080
quarkus.datasource.db-kind=h2
quarkus.datasource.username=archstock
quarkus.datasource.password=archstock
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/archstock;DB_CLOSE_ON_EXIT=FALSE
quarkus.hibernate-orm.database.generation=update
quarkus.smallrye-openapi.info-title=Arch Stock - API de Estoque
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API demonstrativa para cadastro de produtos e movimentação de estoque.
quarkus.swagger-ui.always-include=true
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:archstock-test;DB_CLOSE_DELAY=-1
